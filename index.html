<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendari Fires 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent-yellow: #ffc600;
      --accent-yellow-light: #fff9db;
      --text-dark: #222222;
      --text-muted: #666666;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    header {
      background-color: var(--primary);
      color: var(--accent-yellow);
      padding: 16px;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 3px solid var(--accent-yellow);
      z-index: 10;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* Targeta del calendari */
    .calendar-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      border-top: 4px solid var(--accent-yellow);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-name {
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      padding-bottom: 8px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: all 0.2s ease;
    }

    .day-cell:hover {
      background-color: #f0f0f0;
    }

    .day-cell.selected {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .day-cell.has-event {
      background-color: var(--accent-yellow);
      color: #000000;
      font-weight: 700;
    }

    .day-cell.has-event.selected {
      box-shadow: 0 0 0 2px var(--primary), 0 0 0 4px var(--accent-yellow);
    }

    /* Secció d'esdeveniments */
    .events-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .event-card {
      border-left: 5px solid var(--accent-yellow);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left-width: 5px;
      border-left-color: var(--accent-yellow);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .event-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .detail-item {
      display: flex;
      align-items: flex-start;
      background-color: var(--accent-yellow-light);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .detail-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      color: var(--primary);
      min-width: 130px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .detail-value {
      color: var(--text-dark);
      font-weight: 500;
      flex: 1;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 12px 0;
    }

    .footer-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--accent-yellow);
      color: var(--primary);
      text-align: center;
      padding: 14px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.15);
      z-index: 20;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>Calendari Fires 2026</header>
  
  <div class="content">
    <div class="calendar-card">
      <div class="calendar-header">
        <span id="monthYearDisplay">Octubre 2026</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="events-section">
      <div class="section-title" id="selectedDateTitle">Esdeveniments</div>
      <div id="eventsList"></div>
    </div>
  </div>

  <div class="footer-banner">
    Fal·lera Gironina
  </div>
</div>

<script>
  // Simulació de les dades obtingudes de la descripció de Google Calendar
  const eventsData = {
    "2026-10-23": [
      {
        titol: "INAUGURACIÓ FIRES",
        descriptionRaw: JSON.stringify({
          "hora_plantada": "16:00h",
          "lloc_plantada": "Plaça Hotel Carlemany",
          "inici_cercavila": "17:30h",
          "recorregut": "Plaça Hotel Carlemany, Joan Maragall, Plaça Catalunya, Plaça del Vi",
          "prego": "20:00h",
          "balls": "21:00h"
        })
      }
    ]
  };

  let selectedDateKey = "2026-10-23";

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const daysOfWeek = ["Dl", "Dt", "Dc", "Dj", "Dv", "Ds", "Dg"];
    daysOfWeek.forEach(day => {
      const el = document.createElement("div");
      el.className = "day-name";
      el.innerText = day;
      grid.appendChild(el);
    });

    // Octubre 2026 comença en dijous (offset 3)
    const offsetDays = 3;
    const totalDays = 31;

    for (let i = 0; i < offsetDays; i++) {
      grid.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayStr = day < 10 ? `0${day}` : `${day}`;
      const dateKey = `2026-10-${dayStr}`;

      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.innerText = day;

      if (eventsData[dateKey]) {
        cell.classList.add("has-event");
      }

      if (dateKey === selectedDateKey) {
        cell.classList.add("selected");
      }

      cell.onclick = () => selectDate(dateKey);
      grid.appendChild(cell);
    }
  }

  function selectDate(dateKey) {
    selectedDateKey = dateKey;
    renderCalendar();
    renderEvents();
  }

  function renderEvents() {
    const listContainer = document.getElementById("eventsList");
    const titleContainer = document.getElementById("selectedDateTitle");

    const parts = selectedDateKey.split("-");
    titleContainer.innerText = `Esdeveniments (${parts[2]}/${parts[1]}/${parts[0]})`;

    listContainer.innerHTML = "";

    const events = eventsData[selectedDateKey];

    if (!events || events.length === 0) {
      listContainer.innerHTML = `<div class="empty-state">No hi ha cap esdeveniment programat per a aquest dia.</div>`;
      return;
    }

    events.forEach(event => {
      const card = document.createElement("div");
      card.className = "event-card";

      let detailsHtml = "";

      try {
        // Intenta convertir la descripció JSON en objecte de dades
        const fields = JSON.parse(event.descriptionRaw);

        detailsHtml += `<div class="details-grid">`;
        for (const [key, value] of Object.entries(fields)) {
          // Normalitza el nom del camp per a la visualització
          const labelFormatted = key.replace(/_/g, " ");
          detailsHtml += `
            <div class="detail-item">
              <span class="detail-label">${labelFormatted}:</span>
              <span class="detail-value">${value}</span>
            </div>`;
        }
        detailsHtml += `</div>`;

      } catch (e) {
        // Si no és un JSON vàlid, mostra el text tal com està
        detailsHtml = `<div style="margin-top:8px; font-size:0.9rem;">${event.descriptionRaw}</div>`;
      }

      card.innerHTML = `
        <div class="event-title">${event.titol}</div>
        ${detailsHtml}
      `;

      listContainer.appendChild(card);
    });
  }

  renderCalendar();
  renderEvents();
</script>

</body>
</html>
