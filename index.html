<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendari Fires 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #f7f9fb;
      --card-bg: #ffffff;
      --primary-ocre: #ffc600;
      --ocre-light: #fff9db;
      --text-dark: #2c3e50;
      --text-muted: #8e9aa8;
      --border-color: #eef2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    /* Top Navigation Header */
    .top-header {
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Sub-header amb columnes DATE / EVENTS */
    .sub-header {
      display: flex;
      background: var(--card-bg);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    .col-date-title { width: 60px; }
    .col-events-title { flex: 1; display: flex; justify-content: space-between; align-items: center; }

    /* Llista d'agenda amb línia temporal */
    .content-timeline {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 100px 0;
    }

    .day-row {
      display: flex;
      padding: 0 20px;
      position: relative;
    }

    /* Columna de Data i Línia Vertical */
    .date-col {
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      padding-top: 6px;
    }

    .day-num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1;
    }

    .day-name {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Línia temporal amb cercle */
    .timeline-indicator {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: var(--bg-app);
      z-index: 2;
    }

    .day-row.has-events .timeline-indicator {
      border-color: var(--primary-ocre);
      background: var(--primary-ocre);
    }

    .timeline-line {
      position: absolute;
      right: 15px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--border-color);
      z-index: 1;
    }

    /* Columna d'esdeveniments i targetes */
    .events-col {
      flex: 1;
      padding-left: 15px;
      padding-bottom: 20px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      border-left: 4px solid var(--primary-ocre);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .event-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .event-details {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.8rem;
      color: #555;
    }

    .detail-row {
      margin-bottom: 3px;
    }

    .detail-key {
      font-weight: 500;
      color: var(--text-dark);
    }

    /* Barra inferior estil app */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .banner-text {
      background-color: var(--primary-ocre);
      color: var(--text-dark);
      text-align: center;
      padding: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      position: relative;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--text-dark);
    }

    .fab-btn {
      width: 44px;
      height: 44px;
      background-color: var(--primary-ocre);
      color: var(--text-dark);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      font-weight: 300;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-top: -22px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Capçalera -->
  <div class="top-header">
    <button class="icon-btn">☰</button>
    <div class="nav-title" id="monthDisplay">Octubre 2026 ▾</div>
    <button class="icon-btn">⋮</button>
  </div>

  <!-- Capçalera de taula -->
  <div class="sub-header">
    <div class="col-date-title">DATA</div>
    <div class="col-events-title">
      <span>ESDEVENIMENTS</span>
      <span style="font-size: 0.9rem; cursor: pointer;">⛶</span>
    </div>
  </div>

  <!-- Llista de Dies i Esdeveniments (Timeline) -->
  <div class="content-timeline" id="timelineContent"></div>

  <!-- Barra de navegació inferior fixada -->
  <div class="bottom-bar">
    <div class="banner-text">Fal·lera Gironina</div>
    <div class="nav-icons">
      <div class="nav-item">🔖</div>
      <div class="nav-item active">📅</div>
      <div class="fab-btn">+</div>
      <div class="nav-item">🔲</div>
      <div class="nav-item">♡</div>
    </div>
  </div>
</div>

<script>
  // Dades d'exemple que en el pas següent vindran directament de Google Apps Script
  const eventsData = {
    "2026-10-23": [
      {
        titol: "INAUGURACIÓ FIRES",
        hora: "16:00 - 21:00",
        descriptionRaw: JSON.stringify({
          "hora_plantada": "16:00h",
          "lloc_plantada": "Plaça Hotel Carlemany",
          "inici_cercavila": "17:30h",
          "recorregut": "Plaça Hotel Carlemany, Joan Maragall, Plaça Catalunya, Plaça del Vi",
          "prego": "20:00h",
          "balls": "21:00h"
        })
      }
    ],
    "2026-10-24": [
      {
        titol: "Cercavila de Matinades",
        hora: "08:00",
        descriptionRaw: "Matinades pels carrers del barri vell."
      }
    ]
  };

  const daysNames = ["DIU", "DILL", "DIM", "DMC", "DIJ", "DIV", "DISS"];

  function renderTimeline() {
    const container = document.getElementById("timelineContent");
    container.innerHTML = "";

    // Generar els dies del mes d'Octubre 2026
    const totalDays = 31;

    for (let day = 1; day <= totalDays; day++) {
      const dayStr = day < 10 ? `0${day}` : `${day}`;
      const dateKey = `2026-10-${dayStr}`;
      const dateObj = new Date(2026, 9, day);
      const dayName = daysNames[dateObj.getDay()];

      const dayEvents = eventsData[dateKey] || [];
      const hasEvents = dayEvents.length > 0;

      const row = document.createElement("div");
      row.className = `day-row ${hasEvents ? 'has-events' : ''}`;

      let eventsHtml = "";
      if (hasEvents) {
        dayEvents.forEach(ev => {
          let detailsFormatted = "";
          try {
            const fields = JSON.parse(ev.descriptionRaw);
            detailsFormatted = `<div class="event-details">`;
            for (const [k, v] of Object.entries(fields)) {
              detailsFormatted += `<div class="detail-row"><span class="detail-key">${k.replace(/_/g, " ")}:</span> ${v}</div>`;
            }
            detailsFormatted += `</div>`;
          } catch(e) {
            detailsFormatted = `<div class="event-details">${ev.descriptionRaw}</div>`;
          }

          eventsHtml += `
            <div class="event-card">
              <div class="event-header">
                <span class="event-title">${ev.titol}</span>
                <span class="event-time">${ev.hora || ''}</span>
              </div>
              ${detailsFormatted}
            </div>
          `;
        });
      }

      row.innerHTML = `
        <div class="date-col">
          <div class="day-num">${dayStr}</div>
          <div class="day-name">${dayName}</div>
          <div class="timeline-indicator"></div>
          <div class="timeline-line"></div>
        </div>
        <div class="events-col">
          ${eventsHtml}
        </div>
      `;

      container.appendChild(row);
    }
  }

  renderTimeline();
</script>

</body>
</html>
