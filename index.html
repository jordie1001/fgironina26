<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendari Fires 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #f7f9fb;
      --card-bg: #ffffff;
      --primary-ocre: #ffc600;
      --text-dark: #2c3e50;
      --text-muted: #8e9aa8;
      --border-color: #eef2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    /* Header superior */
    .top-header {
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-dark);
      cursor: pointer;
      font-weight: bold;
      padding: 0 8px;
    }

    /* Selector de vista */
    .view-selector-bar {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .view-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
    }

    .view-tab.active {
      color: var(--text-dark);
      border-bottom-color: var(--primary-ocre);
    }

    /* Àrea de contingut */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 90px;
    }

    /* Vista Calendari */
    .calendar-card {
      background: var(--card-bg);
      margin: 16px;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-top: 4px solid var(--primary-ocre);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .grid-day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      padding-bottom: 8px;
    }

    .grid-day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 50%;
      color: var(--text-muted);
      pointer-events: none;
      opacity: 0.4;
    }

    .grid-day-cell.has-event {
      background-color: var(--primary-ocre);
      color: var(--text-dark);
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
      opacity: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .grid-day-cell.selected {
      box-shadow: 0 0 0 2px var(--text-dark), 0 0 0 4px var(--primary-ocre);
    }

    .selected-events-container {
      padding: 0 16px;
    }

    /* Vista Llista (Timeline) */
    .day-row {
      display: flex;
      padding: 12px 20px 0 20px;
      position: relative;
    }

    .date-col {
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }

    .day-num {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1;
    }

    .day-name {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .timeline-indicator {
      position: absolute;
      right: 12px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-ocre);
      z-index: 2;
    }

    .timeline-line {
      position: absolute;
      right: 15px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--border-color);
      z-index: 1;
    }

    .events-col {
      flex: 1;
      padding-left: 15px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      border-left: 4px solid var(--primary-ocre);
    }

    .event-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .event-details {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.8rem;
      color: #555;
    }

    .detail-row { margin-bottom: 3px; }
    .detail-key { font-weight: 600; color: var(--text-dark); text-transform: capitalize; }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Banner inferior fixat */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .banner-text {
      background-color: var(--primary-ocre);
      color: var(--text-dark);
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-header">
    <div class="nav-controls">
      <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
      <div class="nav-title" id="monthDisplay">Carregant...</div>
      <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
    </div>
  </div>

  <div class="view-selector-bar">
    <div class="view-tab active" id="tabCalendar" onclick="switchView('calendar')">Vista Calendari</div>
    <div class="view-tab" id="tabList" onclick="switchView('list')">Vista Llista</div>
  </div>

  <div class="content-area" id="mainContent">
    <div class="empty-state">Carregant esdeveniments de Google Calendar...</div>
  </div>

  <div class="bottom-bar">
    <div class="banner-text">Fal·lera Gironina</div>
  </div>
</div>

<script>
  const API_KEY = "AIzaSyDu9KdgDjl34V_1vnKaBCfttsP0TD8sFQ";
  const CALENDAR_ID = "fd6ecb65a2fb197af285eaca224d7b71400dc26aeafe16fd77aa3f97086b466a@group.calendar.google.com";

  let currentYear = 2026;
  let currentMonth = 9; // Octubre (0-indexed: 9 = Octubre)
  let activeView = "calendar";
  let selectedDateKey = null;
  let eventsData = {};

  const monthNames = [
    "Gener", "Febrer", "Març", "Abril", "Maig", "Juny", 
    "Juliol", "Agost", "Setembre", "Octubre", "Novembre", "Desembre"
  ];
  const daysNames = ["DIU", "DILL", "DIM", "DMC", "DIJ", "DIV", "DISS"];

  async function fetchCalendarEvents() {
    document.getElementById("mainContent").innerHTML = `<div class="empty-state">Carregant esdeveniments...</div>`;
    
    const timeMin = new Date(currentYear, currentMonth, 1).toISOString();
    const timeMax = new Date(currentYear, currentMonth + 1, 0, 23, 59, 59).toISOString();

    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

    try {
      const response = await fetch(url);
      const data = await response.json();

      eventsData = {};

      if (data.items) {
        data.items.forEach(item => {
          const start = item.start.date || item.start.dateTime;
          if (start) {
            const dateKey = start.split("T")[0];
            if (!eventsData[dateKey]) eventsData[dateKey] = [];

            eventsData[dateKey].push({
              titol: item.summary || "Sense títol",
              descriptionRaw: item.description || ""
            });
          }
        });
      }

      renderView();
    } catch (error) {
      console.error("Error carregant esdeveniments:", error);
      document.getElementById("mainContent").innerHTML = `<div class="empty-state">Error en carregar les dades de Google Calendar.</div>`;
    }
  }

  function updateHeader() {
    document.getElementById("monthDisplay").innerText = `${monthNames[currentMonth]} ${currentYear}`;
  }

  function switchView(view) {
    activeView = view;
    document.getElementById("tabCalendar").classList.toggle("active", view === "calendar");
    document.getElementById("tabList").classList.toggle("active", view === "list");
    selectedDateKey = null;
    renderView();
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    } else if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    selectedDateKey = null;
    updateHeader();
    fetchCalendarEvents();
  }

  function renderView() {
    updateHeader();
    const container = document.getElementById("mainContent");
    container.innerHTML = "";

    if (activeView === "calendar") {
      renderCalendarView(container);
    } else {
      renderListView(container);
    }
  }

  function renderCalendarView(container) {
    const card = document.createElement("div");
    card.className = "calendar-card";

    const grid = document.createElement("div");
    grid.className = "calendar-grid";

    const weekDays = ["Dl", "Dt", "Dc", "Dj", "Dv", "Ds", "Dg"];
    weekDays.forEach(d => {
      const el = document.createElement("div");
      el.className = "grid-day-name";
      el.innerText = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const offsetDays = (firstDay === 0 ? 6 : firstDay - 1);
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < offsetDays; i++) {
      grid.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayStr = day < 10 ? `0${day}` : `${day}`;
      const monthStr = (currentMonth + 1) < 10 ? `0${currentMonth + 1}` : `${currentMonth + 1}`;
      const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

      const cell = document.createElement("div");
      cell.className = "grid-day-cell";
      cell.innerText = day;

      if (eventsData[dateKey] && eventsData[dateKey].length > 0) {
        cell.classList.add("has-event");
        if (dateKey === selectedDateKey) cell.classList.add("selected");

        cell.onclick = () => {
          selectedDateKey = dateKey;
          renderView();
        };
      }

      grid.appendChild(cell);
    }

    card.appendChild(grid);
    container.appendChild(card);

    if (selectedDateKey && eventsData[selectedDateKey]) {
      const eventsContainer = document.createElement("div");
      eventsContainer.className = "selected-events-container";
      eventsContainer.innerHTML = generateEventsListHtml(eventsData[selectedDateKey]);
      container.appendChild(eventsContainer);
    }
  }

  function renderListView(container) {
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    let hasAnyEventsInMonth = false;

    for (let day = 1; day <= totalDays; day++) {
      const dayStr = day < 10 ? `0${day}` : `${day}`;
      const monthStr = (currentMonth + 1) < 10 ? `0${currentMonth + 1}` : `${currentMonth + 1}`;
      const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

      const dayEvents = eventsData[dateKey];

      if (dayEvents && dayEvents.length > 0) {
        hasAnyEventsInMonth = true;
        const dateObj = new Date(currentYear, currentMonth, day);
        const dayName = daysNames[dateObj.getDay()];

        const row = document.createElement("div");
        row.className = "day-row";

        row.innerHTML = `
          <div class="date-col">
            <div class="day-num">${dayStr}</div>
            <div class="day-name">${dayName}</div>
            <div class="timeline-indicator"></div>
            <div class="timeline-line"></div>
          </div>
          <div class="events-col">
            ${generateEventsListHtml(dayEvents)}
          </div>
        `;

        container.appendChild(row);
      }
    }

    if (!hasAnyEventsInMonth) {
      container.innerHTML = `<div class="empty-state">No hi ha cap esdeveniment programat per a aquest mes.</div>`;
    }
  }

  function generateEventsListHtml(events) {
    let html = "";
    events.forEach(ev => {
      let cleanDescription = ev.descriptionRaw
        .replace(/<br\s*[\/]?>/gi, "")
        .replace(/<\/?[^>]+(>|$)/g, "")
        .trim();

      let detailsFormatted = "";
      try {
        const fields = JSON.parse(cleanDescription);
        detailsFormatted = `<div class="event-details">`;
        for (const [k, v] of Object.entries(fields)) {
          detailsFormatted += `<div class="detail-row"><span class="detail-key">${k.replace(/_/g, " ")}:</span> ${v}</div>`;
        }
        detailsFormatted += `</div>`;
      } catch(e) {
        detailsFormatted = cleanDescription ? `<div class="event-details">${cleanDescription}</div>` : "";
      }

      html += `
        <div class="event-card">
          <div class="event-header">
            <span class="event-title">${ev.titol}</span>
          </div>
          ${detailsFormatted}
        </div>
      `;
    });
    return html;
  }

  // Càrrega inicial
  fetchCalendarEvents();
</script>

</body>
</html>
