<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendari Fires 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent-yellow: #ffc600;
      --text-dark: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    header {
      background-color: var(--primary);
      color: var(--accent-yellow);
      padding: 16px;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 3px solid var(--accent-yellow);
      z-index: 10;
    }

    .content {
      flex: 1;
      padding: 12px;
      padding-bottom: 75px;
      display: flex;
      flex-direction: column;
    }

    /* Contenidor adaptatiu per a l'iframe */
    .iframe-container {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-top: 4px solid var(--accent-yellow);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .footer-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--accent-yellow);
      color: var(--primary);
      text-align: center;
      padding: 14px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.15);
      z-index: 20;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>Calendari Fires 2026</header>
  
  <div class="content">
    <div class="iframe-container">
      <iframe src="https://calendar.google.com/calendar/embed?src=falleragironina%40gmail.com&ctz=Europe%2FMadrid&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>

  <div class="footer-banner">
    Fal·lera Gironina
  </div>
</div>

</body>
</html>
