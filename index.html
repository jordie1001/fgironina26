<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendari Fires 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent-yellow: #ffc600;
      --accent-yellow-light: #fff9db;
      --text-dark: #222222;
      --text-muted: #666666;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    header {
      background-color: var(--primary);
      color: var(--accent-yellow);
      padding: 16px;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 3px solid var(--accent-yellow);
      z-index: 10;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    .events-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .event-card {
      border-left: 5px solid var(--accent-yellow);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left-width: 5px;
      border-left-color: var(--accent-yellow);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .event-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Targetes de detalls personalitzades */
    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .detail-item {
      display: flex;
      align-items: flex-start;
      background-color: var(--accent-yellow-light);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .detail-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      color: var(--primary);
      min-width: 130px;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .detail-value {
      color: var(--text-dark);
      font-weight: 500;
      flex: 1;
    }

    .footer-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--accent-yellow);
      color: var(--primary);
      text-align: center;
      padding: 14px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.15);
      z-index: 20;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>Calendari Fires 2026</header>
  
  <div class="content">
    <div class="events-section">
      <div class="section-title">Esdeveniment: 23 d'Octubre</div>
      
      <!-- Exemple de renderització visual de l'esdeveniment -->
      <div class="event-card">
        <div class="event-header">
          <span class="event-title">INAUGURACIÓ FIRES</span>
        </div>

        <div class="details-grid">
          <div class="detail-item">
            <span class="detail-label">Hora de Plantada:</span>
            <span class="detail-value">16:00h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Lloc de Plantada:</span>
            <span class="detail-value">Plaça Hotel Carlemany</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Inici Cercavila:</span>
            <span class="detail-value">17:30h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Recorregut:</span>
            <span class="detail-value">Plaça Hotel Carlemany, Joan Maragall, Plaça Catalunya, Plaça del Vi</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Pregó:</span>
            <span class="detail-value">20:00h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Balls:</span>
            <span class="detail-value">21:00h</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="footer-banner">
    Fal·lera Gironina
  </div>
</div>

</body>
</html>
