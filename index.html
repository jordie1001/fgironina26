<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Calendari i Esdeveniments</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent-yellow: #f1c40f;
      --text-dark: #333333;
      --text-muted: #7f8c8d;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenidor amb format de pantalla de mòbil */
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    /* Capçalera */
    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Targeta del calendari */
    .calendar-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
      color: var(--primary);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 8px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .day-cell:hover {
      background-color: #f0f0f0;
    }

    .day-cell.selected {
      border: 2px solid var(--primary);
    }

    /* Cercle groc per indicar esdeveniments */
    .day-cell.has-event::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--accent-yellow);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Secció d'esdeveniments del dia */
    .events-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .section-title {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .event-item {
      border-left: 4px solid var(--accent-yellow);
      background-color: #fffdf0;
      padding: 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .event-item:hover {
      background-color: #fff9d6;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-title {
      font-weight: 600;
      color: var(--text-dark);
    }

    .event-time {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Detalls extres de l'esdeveniment */
    .event-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      display: none;
      font-size: 0.85rem;
      color: var(--text-dark);
    }

    .event-details.open {
      display: block;
    }

    .detail-row {
      margin-bottom: 4px;
    }

    .detail-label {
      font-weight: 600;
      color: var(--primary);
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>El Meu Calendari</header>
  
  <div class="content">
    <!-- Targeta Calendari -->
    <div class="calendar-card">
      <div class="calendar-header">
        <span id="monthYearDisplay">Setembre 2026</span>
      </div>
      <div class="calendar-grid" id="calendarGrid">
        <!-- Generat amb JavaScript -->
      </div>
    </div>

    <!-- Secció Esdeveniments del Dia -->
    <div class="events-section">
      <div class="section-title" id="selectedDateTitle">Esdeveniments</div>
      <div id="eventsList">
        <!-- Esdeveniments generats dinàmicament -->
      </div>
    </div>
  </div>
</div>

<script>
  // Dades d'exemple d'esdeveniments. 
  // Les dades extres estan estructurades com un objecte de camps personalitzats.
  const eventsData = {
    "2026-09-10": [
      {
        id: 1,
        titol: "Reunió de projecte",
        hora: "10:00",
        lloc: "Oficina central / Sala B",
        responsable: "Anna",
        notes: "Portar la documentació impressa i la proposta de disseny."
      }
    ],
    "2026-09-15": [
      {
        id: 2,
        titol: "Assaig general",
        hora: "18:30",
        lloc: "Local d'assaig",
        vestuari: "Camisa blanca",
        notes: "Comprovació del material de so abans de començar."
      },
      {
        id: 3,
        titol: "Sopar d'equip",
        hora: "21:00",
        lloc: "Restaurant El Racó",
        reserva: "A nom de Jordi",
        notes: "Confirmar assistència abans de migdia."
      }
    ],
    "2026-09-22": [
      {
        id: 4,
        titol: "Revisió tècnica",
        hora: "11:15",
        lloc: "Taller principal",
        tecnic: "Marc",
        notes: "Revisió de manteniment trimestral."
      }
    ]
  };

  let selectedDateKey = "2026-09-15"; // Data inicial seleccionada per defecte

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const daysOfWeek = ["Dl", "Dt", "Dc", "Dj", "Dv", "Ds", "Dg"];
    daysOfWeek.forEach(day => {
      const el = document.createElement("div");
      el.className = "day-name";
      el.innerText = day;
      grid.appendChild(el);
    });

    // Configuració del mes de Setembre 2026 (Comença en dimarts = offset 1)
    const offsetDays = 1;
    const totalDays = 30;

    for (let i = 0; i < offsetDays; i++) {
      const emptyCell = document.createElement("div");
      grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayStr = day < 10 ? `0${day}` : `${day}`;
      const dateKey = `2026-09-${dayStr}`;

      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.innerText = day;

      if (eventsData[dateKey]) {
        cell.classList.add("has-event");
      }

      if (dateKey === selectedDateKey) {
        cell.classList.add("selected");
      }

      cell.onclick = () => selectDate(dateKey);
      grid.appendChild(cell);
    }
  }

  function selectDate(dateKey) {
    selectedDateKey = dateKey;
    renderCalendar();
    renderEvents();
  }

  function renderEvents() {
    const listContainer = document.getElementById("eventsList");
    const titleContainer = document.getElementById("selectedDateTitle");

    const parts = selectedDateKey.split("-");
    titleContainer.innerText = `Esdeveniments (${parts[2]}/${parts[1]}/${parts[0]})`;

    listContainer.innerHTML = "";

    const events = eventsData[selectedDateKey];

    if (!events || events.length === 0) {
      listContainer.innerHTML = `<div class="empty-state">No hi ha cap esdeveniment programat per a aquest dia.</div>`;
      return;
    }

    events.forEach(event => {
      const item = document.createElement("div");
      item.className = "event-item";

      // Es generen dinàmicament tots els camps extres que contingui l'objecte
      let extraDetailsHtml = "";
      for (const [key, value] of Object.entries(event)) {
        if (!["id", "titol", "hora"].includes(key)) {
          const formattedKey = key.charAt(0).toUpperCase() + key.slice(1);
          extraDetailsHtml += `
            <div class="detail-row">
              <span class="detail-label">${formattedKey}:</span> ${value}
            </div>`;
        }
      }

      item.innerHTML = `
        <div class="event-header">
          <span class="event-title">${event.titol}</span>
          <span class="event-time">${event.hora} h</span>
        </div>
        <div class="event-details" id="details-${event.id}">
          ${extraDetailsHtml}
        </div>
      `;

      item.onclick = () => {
        const detailsEl = document.getElementById(`details-${event.id}`);
        detailsEl.classList.toggle("open");
      };

      listContainer.appendChild(item);
    });
  }

  // Inicialització
  renderCalendar();
  renderEvents();
</script>

</body>
</html>
